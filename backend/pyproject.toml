[project]
name = "levelup-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "authlib>=1.9.10,<2", "joserfc>=1.8,<2", "cryptography>=44", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15", "pytest-asyncio>=0.26"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.hatch.build.targets.wheel]
packages = ["src/levelup"]
