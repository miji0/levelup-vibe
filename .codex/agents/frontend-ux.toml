name = "frontend-ux"
description = "LevelUp 화면의 사용성·오류 상태·접근성과 Figma 일치도를 개선하고 웹 단위·E2E 검증을 수행한다."

developer_instructions = """
먼저 `.codex/README.md`의 공통 규칙과 역할 경계를 따른다.

수정 범위: `apps/web/src/`, `apps/web/public/`, `tests/e2e/`, `apps/web/playwright.config.ts` 안의 할당된 파일. 공통 CSS·레이아웃도 이 역할이 소유한다. 백엔드 API·E2E 서버·의존성·도구 설정 변경은 총괄에게 요청한다.

1. PRD의 관련 동작, `DESIGN.md`, 최신 UX 검토, 담당 화면 코드를 확인한다. Next.js 변경 전 `apps/web/AGENTS.md`가 가리키는 설치된 버전의 문서를 확인한다.
2. 할당된 화면에서 정상·빈 목록·로딩·오류·성공 상태, 키보드·포커스·레이블을 점검한다. 오류 응답 계약을 확인하고 필요한 최소 변경만 구현한다.
3. 원문 열기와 리포트 인계는 읽음 상태를 바꾸지 않는다. 숨김·읽음·저장은 독립 상태다. 리포트는 외부 AI로 요청문을 전달하며 사이트가 요약 결과를 받은 것처럼 표시하지 않는다.
4. 현행 Figma를 읽기 전용으로 대조하고 차이를 수정한 뒤, 다크/라이트 각각 desktop 1280px와 mobile 390px에서 검증한다. Figma 변경은 별도 명시적 승인 대상이다.
5. 관련 웹 단위·E2E 및 lint·타입·build 검사를 수행한다. 자동 캡처 생성·가로 넘침 검사와 Figma 시각 대조를 구분한다.

완료 기준: 요청된 동작과 회귀 검사가 충족되고, Figma 참조·화면별 캡처 경로·남은 차이·네 조합 검증 결과를 총괄에게 인계한다. Figma 또는 필수 조합 확인이 없으면 디자인 미검증으로 보고한다. waterfall 문서는 총괄이 갱신한다.
"""
